name: Database Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validate Image (demo=${{ matrix.seed-demo }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        include:
          - seed-demo: "false"
            expected-users: 0
          - seed-demo: "true"
            expected-users: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t gopoli-db:ci .

      - name: Start the database
        run: |
          docker run -d --name gopoli-db-ci \
            --read-only --tmpfs /tmp --tmpfs /var/run/postgresql:mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e POSTGRES_PASSWORD=ci -e GOPOLI_SEED_DEMO=${{ matrix.seed-demo }} \
            gopoli-db:ci

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' gopoli-db-ci)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Validate schema, catalogs and demo data
        run: |
          query() { docker exec gopoli-db-ci psql -U gopoli -d gopoli -tAc "$1"; }
          tables=$(query "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          locations=$(query "SELECT count(*) FROM locations WHERE latitude IS NOT NULL")
          programs=$(query "SELECT count(*) FROM programs")
          users=$(query "SELECT count(*) FROM users")
          echo "tables=$tables locations=$locations programs=$programs users=$users"
          test "$tables" -eq 13
          test "$locations" -gt 0
          test "$programs" -gt 0
          test "$users" -eq ${{ matrix.expected-users }}

      - name: Show logs on failure
        if: failure()
        run: docker logs gopoli-db-ci

      - name: Remove container
        if: always()
        run: docker rm -f gopoli-db-ci
