name: Database Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validate Image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t gopoli-db:ci .

      - name: Start the database
        run: docker run -d --name gopoli-db-ci -e POSTGRES_PASSWORD=ci gopoli-db:ci

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' gopoli-db-ci)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs gopoli-db-ci
          exit 1

      - name: Validate schema and seed
        run: |
          query() { docker exec gopoli-db-ci psql -U gopoli -d gopoli -tAc "$1"; }
          tables=$(query "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          ubicaciones=$(query "SELECT count(*) FROM ubicacion")
          carreras=$(query "SELECT count(*) FROM carrera")
          echo "tables=$tables ubicaciones=$ubicaciones carreras=$carreras"
          test "$tables" -ge 13
          test "$ubicaciones" -gt 0
          test "$carreras" -gt 0

      - name: Show logs on failure
        if: failure()
        run: docker logs gopoli-db-ci

      - name: Remove container
        if: always()
        run: docker rm -f gopoli-db-ci
