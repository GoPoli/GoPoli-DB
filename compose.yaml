services:
  db-gopoli:
    build: .
    image: ghcr.io/gopoli/gopoli-db:latest
    container_name: gopoli-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gopoli}
      POSTGRES_USER: ${POSTGRES_USER:-gopoli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      GOPOLI_SEED_DEMO: ${GOPOLI_SEED_DEMO:-true}
    volumes:
      - gopoli_pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

volumes:
  gopoli_pgdata:
